input:
  folder: testdata
  namespace:
    # m8g can be replaced by the namespace under control (to test content negotiaion ) 
    m8g: 'http://data.europa.eu/m8g/'
    # test that the terms under the namespace under control redirect to the fwd url
    fwd: 'https://semiceu.github.io/'
  specs:
    - https://semiceu.github.io/Core-Location-Vocabulary/releases/2.1.1/
